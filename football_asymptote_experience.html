<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundamatics Football Asymptote Experience</title>
  <style>
    :root{
      --fm-blue:#4D9DFF;
      --fm-deep:#2F7EEA;
      --fm-violet:#7F5CFF;
      --fm-pink:#FF5DAA;
      --fm-yellow:#FFD35A;
      --fm-orange:#FF9F43;
      --ink:#0B1B2B;
      --grass:#18A558;
      --grass2:#0C6B3B;
      --card:rgba(255,255,255,.94);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:
        radial-gradient(circle at 80% 8%,rgba(255,255,255,.25),transparent 28%),
        radial-gradient(circle at 12% 0%,rgba(255,211,90,.18),transparent 24%),
        linear-gradient(135deg,var(--fm-blue),var(--fm-deep) 58%,var(--fm-violet));
      color:var(--ink);
      padding:16px;
    }
    .wrap{max-width:1180px;margin:auto}
    header{text-align:center;color:white;margin-bottom:18px}
    header::before{
      content:'';
      display:block;
      width:86px;height:86px;
      margin:0 auto 12px;
      background:url('./assets/images/logo.jpeg') center/cover no-repeat white;
      border-radius:24px;
      border:3px solid rgba(255,255,255,.7);
      box-shadow:0 16px 34px rgba(16,32,51,.24);
    }
    header h1{margin:0;font-size:clamp(26px,6vw,42px)}
    header p{margin:8px 0 0;opacity:.94;font-size:clamp(15px,3vw,19px)}
    .app{
      background:var(--card);
      border-radius:32px;
      padding:22px;
      box-shadow:0 28px 70px rgba(16,32,51,.26);
      border:1px solid rgba(255,255,255,.65);
      backdrop-filter:blur(10px);
    }
    .function-card{
      background:linear-gradient(135deg,#fff,#eef6ff);
      border:2px solid rgba(255,255,255,.8);
      border-radius:28px;
      padding:18px;
      text-align:center;
      margin-bottom:18px;
    }
    .function-title{font-size:18px;font-weight:800;margin-bottom:10px}
    .fraction{
      display:inline-grid;
      grid-template-rows:auto 4px auto;
      gap:8px;
      direction:ltr;
      align-items:center;
      font-size:clamp(24px,5vw,36px);
      font-weight:900;
      min-width:min(360px,90vw);
    }
    .frac-line{height:4px;border-radius:999px;background:linear-gradient(90deg,var(--fm-pink),var(--fm-yellow),var(--fm-blue))}
    .lead-coef{display:inline-block;background:linear-gradient(135deg,var(--fm-yellow),var(--fm-orange));border-radius:12px;padding:2px 8px;box-shadow:0 6px 16px rgba(16,32,51,.16)}
    .controls{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:18px;align-items:start}
    .input-box{background:white;border:2px solid #e8eef8;border-radius:24px;padding:16px}
    textarea{width:100%;height:76px;border:1px solid #d0d8e6;border-radius:16px;padding:12px;font-size:16px;direction:ltr;font-family:monospace;resize:vertical}
    .actions{display:flex;flex-direction:column;gap:10px}
    button{border:none;border-radius:16px;padding:14px 18px;cursor:pointer;color:white;font-weight:800;background:linear-gradient(135deg,var(--fm-violet),var(--fm-deep));box-shadow:0 10px 24px rgba(47,126,234,.24);white-space:nowrap}
    button.secondary{background:linear-gradient(135deg,var(--fm-pink),var(--fm-orange))}
    .stadium{
      position:relative;
      height:min(520px,88vw);
      min-height:380px;
      overflow:hidden;
      border-radius:30px;
      background:
        radial-gradient(circle at 50% 0%,rgba(255,255,255,.22),transparent 30%),
        linear-gradient(#07162b 0 30%,#102a4c 30% 46%,#0e4027 46% 100%);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
      margin-top:10px;
    }
    .lights{position:absolute;inset:0;background:radial-gradient(circle at 18% 6%,rgba(255,255,255,.65),transparent 8%),radial-gradient(circle at 82% 6%,rgba(255,255,255,.65),transparent 8%),radial-gradient(circle at 50% 8%,rgba(255,211,90,.35),transparent 10%);opacity:.9}
    .crowd{position:absolute;left:0;right:0;top:29%;height:18%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 5px,rgba(255,255,255,.04) 5px 10px);border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.12)}
    .pitch{position:absolute;left:0;right:0;bottom:0;height:54%;background:repeating-linear-gradient(90deg,var(--grass) 0 54px,var(--grass2) 54px 108px)}
    .center-line{position:absolute;left:50%;bottom:0;width:3px;height:54%;background:rgba(255,255,255,.45)}
    .center-circle{position:absolute;left:50%;bottom:14%;width:160px;height:160px;border:3px solid rgba(255,255,255,.45);border-radius:50%;transform:translateX(-50%)}
    .scoreboard{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.58);color:white;border:2px solid rgba(255,255,255,.22);border-radius:18px;padding:10px 18px;text-align:center;min-width:min(420px,86vw);box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:5}
    .scoreboard .mode{font-size:clamp(18px,4vw,28px);font-weight:900;color:var(--fm-yellow)}
    .scoreboard .sub{font-size:clamp(13px,3vw,16px);opacity:.92;margin-top:4px}
    .player{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:clamp(110px,24vw,170px);height:clamp(180px,38vw,260px);z-index:8;transition:1s cubic-bezier(.2,.9,.2,1)}
    .head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:24%;aspect-ratio:1;border-radius:50%;background:#ffd4a8;border:3px solid #1b2638}
    .hair{position:absolute;left:50%;top:-2%;transform:translateX(-50%);width:27%;height:14%;border-radius:50% 50% 20% 20%;background:#1d1d1d;z-index:2}
    .body{position:absolute;left:50%;top:20%;transform:translateX(-50%);width:44%;height:35%;border-radius:20px 20px 10px 10px;background:linear-gradient(135deg,var(--fm-blue),var(--fm-violet));border:3px solid #1b2638}
    .leg{position:absolute;top:54%;width:14%;height:38%;background:#17324f;border-radius:20px;transform-origin:top center}.leg.l{left:36%;transform:rotate(8deg)}.leg.r{right:36%;transform:rotate(-8deg)}
    .arm{position:absolute;top:24%;width:12%;height:38%;background:#ffd4a8;border-radius:20px;transform-origin:top center}.arm.l{left:23%;transform:rotate(25deg)}.arm.r{right:23%;transform:rotate(-25deg)}
    .ball{position:absolute;left:calc(50% + 110px);bottom:16%;width:clamp(34px,8vw,52px);height:clamp(34px,8vw,52px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 38%,#111 39% 45%,#fff 46%);box-shadow:0 8px 20px rgba(0,0,0,.28);z-index:7;transition:1s}
    .var{position:absolute;right:24px;top:84px;width:min(240px,36vw);background:#07162b;color:white;border:3px solid var(--fm-yellow);border-radius:18px;padding:12px;text-align:center;opacity:0;transform:scale(.6);transition:.8s;z-index:12;box-shadow:0 12px 28px rgba(0,0,0,.34)}
    .var b{display:block;color:var(--fm-yellow);font-size:22px}.var .calc{direction:ltr;font-size:22px;font-weight:900;margin-top:6px}
    .sky-mode .player{bottom:24%}.sky-mode .arm.l{transform:rotate(-145deg)}.sky-mode .arm.r{transform:rotate(145deg)}.sky-mode .ball{bottom:70%;left:54%;transform:scale(.9)}
    .sky-mode .scoreboard{animation:pulse 1.4s infinite}.sky-mode .stadium-flash{opacity:1}
    .ground-mode .player{animation:land .85s ease-in-out 1}.ground-mode .arm.l{transform:rotate(110deg)}.ground-mode .arm.r{transform:rotate(-110deg)}.ground-mode .ball{bottom:8%;left:48%;transform:scale(.85)}
    .var-mode .player{transform:translateX(-50%) rotate(-68deg);bottom:11%}.var-mode .arm.l{transform:rotate(90deg)}.var-mode .arm.r{transform:rotate(-80deg)}.var-mode .leg.l{transform:rotate(70deg)}.var-mode .leg.r{transform:rotate(-65deg)}.var-mode .var{opacity:1;transform:scale(1)}.var-mode .ball{left:30%;bottom:19%}
    .stadium-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.45),transparent 28%);opacity:0;transition:.8s;z-index:4;pointer-events:none}
    @keyframes pulse{0%,100%{box-shadow:0 10px 24px rgba(0,0,0,.25)}50%{box-shadow:0 0 42px rgba(255,211,90,.65)}}
    @keyframes land{0%{transform:translateX(-50%) translateY(-35px)}65%{transform:translateX(-50%) translateY(8px)}100%{transform:translateX(-50%) translateY(0)}}
    .result{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:18px}.result-box{background:white;border-radius:24px;border:2px solid #e8eef8;padding:18px}.result-box h2{margin-top:0}.answer{font-size:clamp(34px,7vw,52px);font-weight:900;text-align:center;color:var(--fm-deep);margin-top:18px}.coef-calc{margin-top:12px;padding:14px;border-radius:18px;text-align:center;font-size:clamp(20px,5vw,28px);font-weight:900;direction:ltr;background:linear-gradient(135deg,#fff6d3,#eef6ff);border:2px solid #ffe08a}
    @media(max-width:850px){body{padding:10px}.app{padding:16px;border-radius:24px}.controls{grid-template-columns:1fr}.actions{flex-direction:row;flex-wrap:wrap}.stadium{height:430px}.result{grid-template-columns:1fr}.var{right:10px;top:82px;width:170px}.center-circle{width:120px;height:120px}.scoreboard{top:12px}}
    @media(max-width:430px){.stadium{height:390px;min-height:350px}.player{width:105px;height:180px}.ball{left:68%;bottom:16%}.var{width:150px;font-size:13px}.var b{font-size:18px}.var .calc{font-size:18px}.scoreboard{min-width:88vw}.sky-mode .ball{bottom:68%;left:54%}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Fundamatics Football Asymptote</h1>
      <p>אותו רעיון מתמטי — דרך אצטדיון, שער, חגיגה ו־VAR</p>
    </header>

    <div class="app">
      <div class="function-card">
        <div class="function-title">הפונקציה הרציונלית</div>
        <div class="fraction">
          <div id="numView">3x² + 1</div>
          <div class="frac-line"></div>
          <div id="denView">6x² - 4</div>
        </div>
      </div>

      <div class="controls">
        <div class="input-box">
          <textarea id="funcInput">(3x^2 + 1)/(6x^2 - 4)</textarea>
        </div>
        <div class="actions">
          <button onclick="parseAndPlay()">נתח מהלך</button>
          <button class="secondary" onclick="randomFunction()">הגרל פונקציה</button>
        </div>
      </div>

      <div class="stadium" id="stadium">
        <div class="lights"></div>
        <div class="crowd"></div>
        <div class="pitch"></div>
        <div class="center-line"></div>
        <div class="center-circle"></div>
        <div class="stadium-flash"></div>
        <div class="scoreboard">
          <div class="mode" id="modeTitle">VAR CHECK</div>
          <div class="sub" id="modeSub">בודקים מי שולט במשחק: המונה או המכנה</div>
        </div>
        <div class="var" id="varBox">
          <b>VAR</b>
          <div>השופט בודק מקדמים</div>
          <div class="calc" id="varCalc">3 ÷ 6 = 0.5</div>
        </div>
        <div class="player" id="player">
          <div class="hair"></div><div class="head"></div><div class="body"></div>
          <div class="arm l"></div><div class="arm r"></div>
          <div class="leg l"></div><div class="leg r"></div>
        </div>
        <div class="ball"></div>
      </div>

      <div class="result">
        <div class="result-box">
          <h2>מה קרה על המגרש?</h2>
          <div id="explanation"></div>
        </div>
        <div class="result-box">
          <h2>האסימפטוטה האופקית</h2>
          <div class="answer" id="answer"></div>
        </div>
      </div>
    </div>
  </div>

<script>
const funcInput=document.getElementById('funcInput');
const numView=document.getElementById('numView');
const denView=document.getElementById('denView');
const stadium=document.getElementById('stadium');
const modeTitle=document.getElementById('modeTitle');
const modeSub=document.getElementById('modeSub');
const explanation=document.getElementById('explanation');
const answer=document.getElementById('answer');
const varCalc=document.getElementById('varCalc');
function toSup(n){return String(n).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]||c).join('')}
function clean(s){return s.replace(/\s/g,'').replace(/−/g,'-')}
function pretty(s){return s.replace(/\^([0-9]+)/g,(m,n)=>toSup(n))}
function leading(poly){let p=clean(poly).replace(/-/g,'+-');if(p[0]==='+')p=p.slice(1);let terms=p.split('+').filter(Boolean);let bestDeg=-1,bestCoef=0;for(const t of terms){let deg=0,coef=0;if(t.includes('x')){let before=t.split('x')[0];if(before===''||before==='+')coef=1;else if(before==='-')coef=-1;else coef=Number(before);let pow=t.match(/x\^(\d+)/);deg=pow?Number(pow[1]):1}else{coef=Number(t);deg=0}if(deg>bestDeg){bestDeg=deg;bestCoef=coef}}return{deg:bestDeg,coef:bestCoef}}
function highlight(poly,lead){let p=pretty(poly);const coefText=lead.coef===1?'':lead.coef===-1?'-':String(lead.coef);const powerText=lead.deg===1?'x':'x'+toSup(lead.deg);const term=coefText+powerText;return p.replace(term,'<span class="lead-coef">'+term+'</span>')}
function splitFraction(input){let s=clean(input);let parts=s.split('/');if(parts.length!==2){alert('כתוב פונקציה בצורה מונה/מכנה');return null}return parts.map(p=>p.replace(/[()]/g,''))}
function parseAndPlay(){const parts=splitFraction(funcInput.value);if(!parts)return;const n=parts[0],d=parts[1];const nl=leading(n),dl=leading(d);numView.innerHTML=highlight(n,nl);denView.innerHTML=highlight(d,dl);play(nl,dl)}
function play(nl,dl){stadium.className='stadium';const nd=nl.deg,dd=dl.deg,nc=nl.coef,dc=dl.coef;let text='',ans='';if(nd>dd){stadium.classList.add('sky-mode');modeTitle.textContent='SKY STRIKER';modeSub.textContent='המונה כבד יותר — הכדור הולך לשמיים';text='המונה שולט במשחק כי החזקה הגבוהה שלו גדולה יותר. הפונקציה לא מתייצבת על גובה קבוע, ולכן אין אסימפטוטה אופקית.';ans='אין'}else if(nd<dd){stadium.classList.add('ground-mode');modeTitle.textContent='GROUND CELEBRATION';modeSub.textContent='המכנה כבד יותר — נוחתים על הקרקע';text='המכנה שולט במשחק כי החזקה הגבוהה שלו גדולה יותר. משהו קטן חלקי משהו עצום מתקרב לאפס — לכן יורדים לקרקע.';ans='y = 0'}else{stadium.classList.add('var-mode');const val=+(nc/dc).toFixed(3);modeTitle.textContent='VAR DECISION';modeSub.textContent='שוויון חזקות — השופט בודק את המקדמים';varCalc.textContent=nc+' ÷ '+dc+' = '+val;text='החזקות שוות, ולכן המשחק הולך ל־VAR. השופט לא מסתכל יותר על החזקות, אלא על המקדמים המובילים:<div class="coef-calc">'+nc+' ÷ '+dc+' = '+val+'</div>';ans='y = '+val}explanation.innerHTML=text;answer.textContent=ans}
function randomFunction(){const cases=['sky','ground','equal'];const c=cases[Math.floor(Math.random()*cases.length)];let nd,dd;if(c==='sky'){dd=Math.floor(Math.random()*3)+1;nd=dd+1}else if(c==='ground'){nd=Math.floor(Math.random()*3)+1;dd=nd+1}else{nd=dd=Math.floor(Math.random()*4)+1}const nc=Math.floor(Math.random()*8)+1,dc=Math.floor(Math.random()*8)+1;funcInput.value=`(${nc}x^${nd}+1)/(${dc}x^${dd}-4)`;parseAndPlay()}
parseAndPlay();
</script>
</body>
</html>
